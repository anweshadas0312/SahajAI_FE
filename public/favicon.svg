<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <defs>
    <radialGradient id="favLitGlass" cx="45%" cy="40%" r="55%" fx="40%" fy="35%">
      <stop offset="0%" stop-color="#FFF9A6" />
      <stop offset="45%" stop-color="#FFDE03" />
      <stop offset="85%" stop-color="#F5B700" />
      <stop offset="100%" stop-color="#E5A700" />
    </radialGradient>
    <filter id="favGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- 7 Glowing Light Rays -->
  <g stroke="#FACC15" stroke-width="5" stroke-linecap="round">
    <line x1="28" y1="20" x2="16" y2="12" />
    <line x1="56" y1="12" x2="56" y2="-2" />
    <line x1="84" y1="16" x2="98" y2="8" />
    <line x1="98" y1="42" x2="114" y2="40" />
    <line x1="96" y1="70" x2="110" y2="76" />
    <line x1="16" y1="46" x2="2" y2="46" />
    <line x1="22" y1="74" x2="8" y2="82" />
  </g>

  <!-- Rotated Bulb Body (-18 deg) -->
  <g transform="rotate(-18 56 60)">
    <!-- Screw Base -->
    <path
      d="M45 74 C45 72 67 72 67 74 L66 82 C66 84 46 84 46 82 Z"
      fill="#334155"
      stroke="#1E293B"
      stroke-width="3.5"
      stroke-linejoin="round"
    />
    <!-- Thread Ridge 1 -->
    <path
      d="M46 81 C46 79 66 79 66 81 L64 87 C64 89 48 89 48 87 Z"
      fill="#1E293B"
      stroke="#0F172A"
      stroke-width="3.5"
      stroke-linejoin="round"
    />
    <!-- Bottom Terminal Nub -->
    <path
      d="M50 88 C50 86 62 86 62 88 C62 93 50 93 50 88 Z"
      fill="#0F172A"
      stroke="#020617"
      stroke-width="2.5"
    />

    <!-- Glowing Yellow Bulb Glass -->
    <path
      d="M56 18 C40 18 30 32 30 46 C30 55 36 62 42 68 C44 70 45 74 45 75 L67 75 C67 74 68 70 70 68 C76 62 82 55 82 46 C82 32 72 18 56 18 Z"
      fill="url(#favLitGlass)"
      stroke="#B48200"
      stroke-width="3"
    />

    <!-- Internal Warm Filament Line -->
    <path
      d="M48 62 L52 46 L56 50 L60 46 L64 62"
      stroke="#FF8800"
      stroke-width="2.5"
      stroke-linecap="round"
      stroke-linejoin="round"
    />

    <!-- Glass Specular Highlight Streak -->
    <path
      d="M40 32 C36 38 36 46 40 52"
      stroke="#FFFFFF"
      stroke-width="3"
      stroke-linecap="round"
      opacity="0.8"
    />
  </g>
</svg>